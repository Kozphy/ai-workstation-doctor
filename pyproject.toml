[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "awd"
version = "0.1.0"
description = "AI Workstation Doctor — Windows-first local AI diagnostics"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kozphy" }]
keywords = ["local-ai", "diagnostics", "windows", "ollama", "llama.cpp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/Kozphy/ai-workstation-doctor"
Repository = "https://github.com/Kozphy/ai-workstation-doctor"
Issues = "https://github.com/Kozphy/ai-workstation-doctor/issues"
Support = "https://github.com/Kozphy/ai-workstation-doctor/blob/main/docs/SUPPORT.md"

[project.scripts]
awd = "awd.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/awd"]

[tool.hatch.build.targets.sdist]
include = ["src/awd", "tests", "docs", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["awd"]
branch = true
